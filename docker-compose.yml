services:
  postgres:
    image: postgres:16-alpine
    container_name: aff-cms-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aff_cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aff_cms}
      POSTGRES_DB: ${POSTGRES_DB:-aff_cms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aff_cms} -d ${POSTGRES_DB:-aff_cms}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
